<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calistenia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --rosa:#C8425C; --rosa-escuro:#A62F47; --rosa-claro:#D97286; --rosa-nevoa:#FCEFF2;
    --grad:linear-gradient(90deg,#BE3B57 0%,#D75C74 100%);
    --tinta:#17171C; --tinta-suave:#3B3B52; --cinza:#8E8E99; --linha:#ECECF0;
    --fundo:#F5F5F7; --branco:#fff;
    --vermelho:#E5364C; --verde:#10B981; --azul:#06AEE4; --amarelo:#F5BE22;
    --sombra-1:0 1px 2px rgba(20,20,30,.05),0 6px 18px rgba(20,20,30,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:#e8e8ec;-webkit-font-smoothing:antialiased;color:var(--tinta)}
  #phone{max-width:440px;margin:0 auto;min-height:100vh;background:var(--fundo);position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.12)}
  .scroll{padding:20px 16px 96px;min-height:100vh}
  h1,h2,h3,p{margin:0}
  .screen-title{font-size:28px;font-weight:800;letter-spacing:-.02em}
  .screen-sub{font-size:15px;color:var(--cinza);font-weight:500;margin-top:2px}
  .label{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--cinza)}
  .card{background:var(--branco);border-radius:18px;box-shadow:var(--sombra-1)}
  .btn-primary{background:var(--grad);color:#fff;height:52px;border:none;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;font-family:inherit;cursor:pointer;width:100%;transition:filter .15s}
  .btn-primary:active{filter:brightness(1.07)}
  .btn-primary:disabled{opacity:.45;cursor:default}
  .btn-ghost{border:1px solid #E3E3E8;background:#fff;height:36px;padding:0 16px;border-radius:999px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--tinta-suave);font-family:inherit;cursor:pointer}
  .chip{border:1px solid #E3E3E8;color:var(--tinta-suave);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;background:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit}
  .chip.on{background:var(--grad);color:#fff;border-color:transparent}
  .fade{animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* tab bar */
  #tabbar{position:sticky;bottom:0;max-width:440px;margin:0 auto;background:#fff;border-top:1px solid var(--linha);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(20,20,30,.04);position:fixed;left:0;right:0;bottom:0}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;cursor:pointer;color:#9A9AA5}
  .tab .pill{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center}
  .tab span{font-size:11px;font-weight:600}
  .tab.on{color:var(--rosa)}
  .tab.on .pill{background:var(--rosa-nevoa)}
  .tab.on span{font-weight:700}
  input,select{font-family:inherit}
</style>
</head>
<body>
<div id="phone">
  <div id="view" class="scroll"></div>
</div>
<nav id="tabbar"></nav>

<script>
/* ---------------- ICONS ---------------- */
const I = {
  home:'<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/>',
  dumbbell:'<path d="M6 8v8"/><path d="M18 8v8"/><path d="M3 10v4"/><path d="M21 10v4"/><path d="M6 12h12"/>',
  diet:'<path d="M5 3v7a2 2 0 0 0 4 0V3"/><path d="M7 10v11"/><path d="M17 3c-2 2-2 5 0 6v12"/>',
  chat:'<path d="M21 12a8 8 0 1 1-3.2-6.4L21 4l-1 4"/>',
  user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 21c0-4 3-6 7-6s7 2 7 6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/>',
  flame:'<path d="M12 22c4-2 6-5 6-9 0-4-4-6-4-11-3 3-8 5-8 11 0 4 2 7 6 9z"/>',
  play:'<polygon points="6 3 20 12 6 21 6 3"/>',
  chevR:'<polyline points="9 6 15 12 9 18"/>',
  chevD:'<polyline points="6 9 12 15 18 9"/>',
  trend:'<polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>',
  scale:'<path d="M12 3v18"/><path d="M5 8h14"/><path d="M5 8l-2 6h4z"/><path d="M19 8l-2 6h4z"/>',
  book:'<path d="M4 19V6a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/>',
  gift:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13"/><path d="M3 8l3-4h12l3 4"/>',
  send:'<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  spark:'<path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>',
  leaf:'<path d="M20 4c-8 0-14 5-14 12 7 0 14-4 14-12z"/><path d="M6 20c0-4 3-8 8-10"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M3 11h18"/>',
  back:'<line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 6 4 12 10 18"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>',
  search:'<circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>',
  walk:'<circle cx="13" cy="4" r="2"/><path d="M7 21l3-6 2-3 3 2 2 1"/><path d="M12 12l-1-4 4 1 2 3"/>',
  playCircle:'<circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/>',
  bolt:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  wave:'<path d="M2 8c2 0 2 2 4 2s2-2 4-2 2 2 4 2 2-2 4-2 2 2 4 2"/><path d="M2 14c2 0 2 2 4 2s2-2 4-2 2 2 4 2 2-2 4-2 2 2 4 2"/>',
};
function svg(name,{s=18,c='currentColor',w=2}={}){return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[name]}</svg>`}

/* ---------------- DATA ---------------- */
const WEEKS=[
  {n:1,name:'Adaptação',desc:'Aprender os movimentos e criar o hábito'},
  {n:2,name:'Ativação',desc:'Aumentar o ritmo e a resistência'},
  {n:3,name:'Intensificação',desc:'Consolidar força e definição'},
];
const EX_POOL=[
  ['Círculos de Braço Garça','Movimento circular amplo dos braços para aquecer os ombros.','Ombros'],
  ['Torção Rítmica em Pé','Rotação do tronco em pé, ativando toda a região do core.','Core'],
  ['Agachamento Templo','Agachamento controlado com braços à frente, foco em pernas.','Pernas'],
  ['Prancha das Pernas Cruzadas','Prancha com pernas cruzadas fortalecendo o core com estabilidade.','Core'],
  ['Elevação de Joelhos','Elevação alternada dos joelhos, cardio leve e abdômen.','Abdômen'],
  ['Flexão de Parede','Flexão apoiada na parede, ideal para iniciantes.','Peito'],
  ['Ponte de Glúteos','Elevação do quadril deitado, ativando glúteos e lombar.','Glúteos'],
  ['Marcha no Lugar','Marcha estacionária para elevar a frequência cardíaca.','Cardio'],
  ['Superman','Deitado de bruços, eleva braços e pernas simultaneamente.','Lombar'],
  ['Abdominal Curto','Contração abdominal curta e controlada.','Abdômen'],
  ['Afundo Alternado','Passada à frente descendo o joelho, foco em pernas.','Pernas'],
  ['Prancha Lateral','Apoio lateral que trabalha os oblíquos.','Oblíquos'],
  ['Polichinelo Suave','Polichinelo de baixo impacto para cardio.','Cardio'],
  ['Rotação de Ombros','Rotação lenta dos ombros para mobilidade.','Ombros'],
  ['Elevação de Panturrilha','Subida na ponta dos pés, fortalece panturrilhas.','Pernas'],
  ['Alongamento Gato-Vaca','Mobilidade da coluna alternando arqueamento.','Coluna'],
];
function dayExercises(dayIdx){
  const out=[];
  for(let i=0;i<10;i++){out.push(EX_POOL[(dayIdx*3+i)%EX_POOL.length]);}
  return out;
}
function totalDay(week,day){return (week-1)*7+day;} // 1..21

const FOOD_GROUPS=[
  {emoji:'🥩',name:'Carnes',items:['Frango','Carne Bovina','Carne Suína','Peixe','Camarão','Peru','Pato','Cordeiro']},
  {emoji:'🥚',name:'Ovos e Laticínios',items:['Ovos','Leite','Queijo','Iogurte','Manteiga','Requeijão']},
  {emoji:'🫘',name:'Leguminosas',items:['Feijão Preto','Feijão Carioca','Lentilha','Grão-de-bico','Ervilha','Soja','Feijão Branco']},
  {emoji:'🥦',name:'Vegetais',items:['Brócolis','Cenoura','Alface','Tomate','Espinafre','Abobrinha','Couve','Pepino']},
  {emoji:'🍎',name:'Frutas',items:['Banana','Maçã','Laranja','Morango','Abacate','Melancia','Uva','Manga']},
];
const RESTRICOES=['Vegetariano','Vegano','Sem Glúten','Sem Lactose','Low Carb','Diabético'];
const FAQ=['Como acelerar o emagrecimento?','Posso treinar com dor muscular?','Quantos litros de água devo beber?','Como manter a motivação?'];
const FAQ_A={
  'Como acelerar o emagrecimento?':'Combine o treino diário com uma alimentação equilibrada e boa hidratação. Se quiser, adicione uma atividade extra leve, como caminhada. Mas sem pressa — consistência vale mais que intensidade. 🌱',
  'Posso treinar com dor muscular?':'Dor leve é normal nos primeiros dias. Respeite seu corpo: se for um desconforto forte, descanse. O treino de hoje já é suficiente.',
  'Quantos litros de água devo beber?':'Uma boa referência é cerca de 35ml por quilo de peso ao dia. Mantenha uma garrafinha por perto e beba ao longo do dia.',
  'Como manter a motivação?':'Celebre cada pequeno passo. Você nunca está atrasado — está no seu dia. Marcar o treino concluído todos os dias cria o hábito. Você consegue! 💪',
};

/* ---------------- STATE ---------------- */
const DEFAULT={
  name:'anjinha', done:{}, minutes:0, metaPeso:80,
  perfil:{idade:22,altura:165,peso:30,meta:80,prazo:32},
  restricoes:{'Sem Lactose':true},
  foods:{'Carnes':['Frango','Carne Bovina','Carne Suína','Peixe','Camarão','Peru','Pato','Cordeiro'],'Ovos e Laticínios':['Queijo','Iogurte','Requeijão'],'Leguminosas':['Feijão Preto']},
  chat:[{r:'bot',t:'Olá! Sou a assistente Atlas. 🌱 Estou aqui para ajudar com qualquer dúvida sobre treinos, dieta, bem-estar ou o aplicativo. Pode me perguntar o que quiser! Como posso te ajudar hoje?'}],
  msgsLeft:5,
  extras:[],
};
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem('calistenia'));return s?{...structuredClone(DEFAULT),...s}:structuredClone(DEFAULT)}catch(e){return structuredClone(DEFAULT)}}
function save(){try{localStorage.setItem('calistenia',JSON.stringify(S))}catch(e){} cloudSave();}
function doneCount(){return Object.values(S.done).filter(Boolean).length}
function progressPct(){return Math.round(doneCount()/21*100)}
function nextDay(){for(let d=1;d<=21;d++){if(!S.done[d])return d}return 21}

/* ---------------- ROUTER ---------------- */
let route={tab:'home',sub:null,data:null};
function go(tab,sub,data){route={tab,sub:sub||null,data:data||null};render()}
const TABS=[['home','Início','home'],['treinos','Treinos','dumbbell'],['dieta','Dieta','diet'],['suporte','Suporte','chat'],['perfil','Perfil','user']];

let lastKey=null;
function render(){
  const v=document.getElementById('view');
  const key=route.tab+'/'+(route.sub||'');
  const sameScreen=(key===lastKey);
  const keepY=window.scrollY;
  let html='';
  if(route.sub==='workout') html=viewWorkout(route.data);
  else if(route.sub==='plano') html=viewPlano();
  else if(route.sub==='receitas') html=viewReceitas();
  else if(route.sub==='program') html=viewProgram();
  else if(route.sub==='exercises') html=viewAllExercises();
  else if(route.sub==='philosophy') html=viewPhilosophy();
  else if(route.sub==='extras') html=viewExtras();
  else if(route.sub==='bonus') html=viewBonus();
  else if(route.tab==='home') html=viewHome();
  else if(route.tab==='treinos') html=viewTreinos();
  else if(route.tab==='dieta') html=viewDieta();
  else if(route.tab==='suporte') html=viewSuporte();
  else if(route.tab==='perfil') html=viewPerfil();
  v.innerHTML='<div class="fade">'+html+'</div>';
  renderTabs();
  // Mantém a posição de rolagem quando é a MESMA tela (toggles, acordeão, registro);
  // só volta ao topo quando muda de tela de verdade.
  if(sameScreen){ window.scrollTo(0,keepY); }
  else { window.scrollTo(0,0); }
  lastKey=key;
  if(route.tab==='suporte'&&!route.sub){const c=document.getElementById('chatScroll');if(c)c.scrollTop=c.scrollHeight;}
}
function renderTabs(){
  document.getElementById('tabbar').innerHTML=TABS.map(([id,label,ic])=>
    `<div class="tab ${route.tab===id&&!route.sub?'on':''}" onclick="go('${id}')">
      <span class="pill">${svg(ic,{s:18})}</span><span>${label}</span></div>`).join('');
}

/* ---------------- HOME ---------------- */
function viewHome(){
  const nd=nextDay(), w=WEEKS[Math.floor((nd-1)/7)], dayInWeek=((nd-1)%7)+1;
  const ex=dayExercises(nd-1);
  const pct=progressPct();
  return `
  <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px">
    <span style="display:inline-block;width:40px;height:40px;background:var(--rosa);-webkit-mask:url('conversacao.png') center/contain no-repeat;mask:url('conversacao.png') center/contain no-repeat"></span>
    <span style="font-family:'Big Shoulders Display';font-weight:800;font-size:26px;color:var(--rosa);letter-spacing:1px">CALISTENIA</span>
    <span style="font-size:11px;font-weight:600;color:var(--cinza);background:var(--rosa-nevoa);padding:3px 8px;border-radius:999px">by Atlas</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
    <div style="width:44px;height:44px;border-radius:999px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff">${svg('user',{s:22})}</div>
    <div><div style="font-size:14px;color:var(--cinza)">Olá,</div><div style="font-size:20px;font-weight:800">${S.name} 🌸</div></div>
  </div>
  <div style="background:var(--rosa-nevoa);border-radius:14px;padding:13px 16px;font-size:14px;font-weight:600;color:var(--rosa-escuro);display:flex;gap:8px;align-items:center;margin-bottom:16px">
    ${svg('spark',{s:16})} Cada dia é uma nova conquista! 🌸
  </div>
  <div class="card" style="padding:18px;display:flex;align-items:center;gap:18px;margin-bottom:16px">
    <div style="width:80px;height:80px;border-radius:999px;background:conic-gradient(var(--rosa) 0deg ${pct*3.6}deg,#F3E3E7 ${pct*3.6}deg 360deg);display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <div style="width:64px;height:64px;border-radius:999px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <span style="font-size:22px;font-weight:800;line-height:1">${doneCount()}</span><span style="font-size:12px;color:var(--cinza);font-weight:600">/21</span></div>
    </div>
    <div style="flex:1">
      <div style="font-size:17px;font-weight:800">Programa 21 Dias</div>
      <div style="font-size:14px;color:#B98A2E;font-weight:600;margin-top:2px">${pct===0?'Comece sua jornada hoje!':pct===100?'Programa concluído! 🎉':'Continue sua jornada!'}</div>
      <div style="height:8px;border-radius:999px;background:#EFEFF2;margin-top:12px;overflow:hidden"><div style="width:${pct}%;height:100%;background:var(--grad)"></div></div>
    </div>
  </div>
  <!-- today workout -->
  <div class="card" style="overflow:hidden;margin-bottom:22px">
    <div style="background:linear-gradient(120deg,#BE3B57 0%,#D0566E 100%);padding:20px;color:#fff">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="label" style="color:#fff;opacity:.9">Treino de hoje</div>
        <div style="background:rgba(255,255,255,.22);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px">Dia ${nd}</div>
      </div>
      <div style="font-size:21px;font-weight:800;margin-top:14px">Semana ${w.n} — ${w.name}</div>
      <div style="font-size:14px;opacity:.9;margin-top:4px">${w.desc}</div>
    </div>
    <div style="padding:16px 20px 20px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;gap:16px;font-size:13px;color:var(--cinza);font-weight:600">
        <span style="display:flex;align-items:center;gap:5px">${svg('clock',{s:13})} 15 min</span>
        <span style="display:flex;align-items:center;gap:5px">${svg('flame',{s:13})} 10 exercícios</span>
      </div>
      ${ex.slice(0,3).map((e,i)=>`<div style="background:#F7F7F9;border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;color:var(--tinta-suave)"><span style="width:24px;height:24px;border-radius:999px;background:var(--rosa-nevoa);color:var(--rosa);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center">${i+1}</span>${e[0]}</div>`).join('')}
      <div style="font-size:13px;color:var(--rosa);font-weight:700;padding-left:4px">+7 exercícios…</div>
      <button class="btn-primary" style="height:48px;margin-top:6px" onclick="go('treinos','workout',${nd})">${svg('play',{s:15,w:2.4})} Iniciar Treino</button>
    </div>
  </div>
  <div style="font-size:19px;font-weight:800;margin-bottom:14px">Minhas Estatísticas</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
    ${statCard('var(--vermelho)','#fff','TREINOS',doneCount(),'Concluídos','flame')}
    ${statCard('var(--verde)','#fff','PROGRESSO',pct+'%','Do programa','trend')}
    ${statCard('var(--azul)','#fff','TEMPO',S.minutes,'Minutos treinados','clock')}
    ${statCard('var(--amarelo)','#3A2A00','META',S.metaPeso+'kg','Peso desejado','scale')}
  </div>
  <div class="card" style="overflow:hidden">
    ${listRow('walk','Atividade Extra','Acelere seus resultados (opcional)',"go('home','extras')",'#C8425C')}
    ${listRow('book','Filosofia do Treino','Entenda nossa metodologia',"go('home','philosophy')",'#06AEE4')}
    ${listRow('gift','Bônus e Conteúdos','Materiais extras exclusivos',"go('home','bonus')",'#7B61FF',true)}
  </div>`;
}
function statCard(bg,fg,label,val,sub,ic){
  return `<div style="background:${bg};border-radius:16px;padding:18px;color:${fg};display:flex;justify-content:space-between;align-items:flex-start;min-height:104px">
    <div><div style="font-size:11px;font-weight:800;letter-spacing:.1em;opacity:.9">${label}</div><div style="font-size:30px;font-weight:800;margin-top:16px">${val}</div><div style="font-size:12px;opacity:.9">${sub}</div></div>
    ${svg(ic,{s:26,c:fg==='#fff'?'rgba(255,255,255,.55)':'rgba(58,42,0,.4)',w:1.8})}</div>`;
}
// hex -> rgba helper para os badges premium
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`}
function iconBadge(ic,color){
  return `<span style="width:46px;height:46px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:${color};
    background:linear-gradient(145deg,${rgba(color,.16)},${rgba(color,.06)});
    box-shadow:inset 0 0 0 1px ${rgba(color,.14)}, 0 6px 14px ${rgba(color,.16)}">${svg(ic,{s:21,w:1.7})}</span>`;
}
function listRow(ic,title,sub,onclick,color,last){
  color=color||'#C8425C';
  return `<div onclick="${onclick||''}" style="padding:15px 16px;display:flex;align-items:center;gap:14px;${last?'':'border-bottom:1px solid #F2F2F5'};cursor:pointer">
    ${iconBadge(ic,color)}
    <div style="flex:1"><div style="font-size:16px;font-weight:700;color:var(--tinta-suave)">${title}</div><div style="font-size:13px;color:var(--cinza);margin-top:1px">${sub}</div></div>
    ${svg('chevR',{s:18,c:'#C6C6CF'})}</div>`;
}

/* ---------------- TREINOS ---------------- */
let openWeek=1;
function viewTreinos(){
  return `

function weekBlock(w){
  const open=openWeek===w.n;
  const nd=nextDay();
  let inner='';
  if(open){
    for(let d=1;d<=7;d++){
      const total=totalDay(w.n,d), done=S.done[total], active=total===nd;
      inner+=`<div style="border:${active?'1.5px solid var(--rosa)':'1px solid #F0F0F3'};border-radius:14px;padding:14px 16px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;${active?'background:#fff':''}">
        <div><div class="label" style="color:var(--cinza)">Semana ${w.n} — ${w.name}</div>
        <div style="font-size:17px;font-weight:800;margin-top:2px">Dia ${d} ${done?'✅':''}</div>
        <div style="font-size:13px;color:var(--cinza);margin-top:4px;display:flex;gap:12px"><span>${svg('clock',{s:12})} 15 min</span><span>${svg('flame',{s:12})} 10 exercícios</span></div></div>
        ${active
          ?`<button class="btn-primary" style="width:auto;height:40px;padding:0 20px;font-size:14px" onclick="go('treinos','workout',${total})">${svg('play',{s:14,w:2.4})} Iniciar</button>`
          :`<button class="btn-ghost" onclick="go('treinos','workout',${total})">${svg('play',{s:13,w:2.4})} Ver</button>`}
      </div>`;
    }
  }
  const doneInWeek=[1,2,3,4,5,6,7].filter(d=>S.done[totalDay(w.n,d)]).length;
  return `<div class="card" style="padding:14px 16px;margin-bottom:14px">
    <div onclick="openWeek=${open?0:w.n};render()" style="display:flex;align-items:center;gap:14px;cursor:pointer">
      <span style="width:36px;height:36px;border-radius:999px;background:${open?'var(--grad)':'#F0F0F3'};color:${open?'#fff':'var(--cinza)'};display:flex;align-items:center;justify-content:center;font-weight:800">${w.n}</span>
      <div style="flex:1"><div style="font-size:16px;font-weight:800">Semana ${w.n}</div><div style="font-size:13px;color:var(--cinza)">${w.name} · ${doneInWeek}/7</div></div>
      ${svg(open?'chevD':'chevR',{s:18,c:'#B9B9C2'})}
    </div>${inner}</div>`;
}

/* ---------------- WORKOUT PLAYER ---------------- */
// Vídeo de cada dia (1..21). Cole aqui o link do vídeo (YouTube ou .mp4) de cada treino.
// Ex.: VIDEOS[1] = "https://www.youtube.com/embed/XXXX";  VIDEOS[2] = "https://.../treino2.mp4";
const VIDEOS = {
  // 1: "https://www.youtube.com/embed/SEU_VIDEO",
};
function toEmbed(url){
  if(!url) return null;
  const yt=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if(yt) return {type:'iframe',src:`https://www.youtube.com/embed/${yt[1]}`};
  if(url.includes('/embed/')) return {type:'iframe',src:url};
  return {type:'video',src:url};
}
function videoBlock(dayTotal,w,dayInWeek){
  const v=toEmbed(VIDEOS[dayTotal]);
  if(v){
    const inner = v.type==='iframe'
      ? `<iframe src="${v.src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>`
      : `<video src="${v.src}" controls playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000"></video>`;
    return `<div class="card" style="overflow:hidden;margin-bottom:16px"><div style="position:relative;width:100%;padding-top:56.25%;background:#000">${inner}</div>
      <div style="padding:12px 16px;font-size:13px;font-weight:700;color:var(--cinza)">${svg('playCircle',{s:14,c:'var(--rosa)'})} Vídeo do treino · Semana ${w.n} · Dia ${dayInWeek}</div></div>`;
  }
  // sem link ainda: placeholder premium
  return `<div class="card" style="overflow:hidden;margin-bottom:16px">
    <div style="position:relative;width:100%;padding-top:56.25%;background:linear-gradient(135deg,#BE3B57,#D0566E)">
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:10px">
        <span style="width:64px;height:64px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center">${svg('play',{s:26,c:'#fff',w:2})}</span>
        <div style="font-size:14px;font-weight:700">Vídeo do treino em preparação</div>
        <div style="font-size:12px;opacity:.85">Semana ${w.n} · Dia ${dayInWeek}</div>
      </div>
    </div></div>`;
}
function viewWorkout(dayTotal){
  const w=WEEKS[Math.floor((dayTotal-1)/7)], dayInWeek=((dayTotal-1)%7)+1;
  const ex=dayExercises(dayTotal-1), done=S.done[dayTotal];
  return `

    ${svg('back',{s:20,c:'var(--tinta-suave)'})}

  ${ex.map((e,i)=>`<div class="card" style="padding:14px 16px;display:flex;gap:12px;align-items:flex-start">

    <div style="flex:1"><div style="font-size:16px;font-weight:700;color:var(--tinta-suave)">${e[0]}</div>
    <div style="font-size:14px;color:var(--cinza);line-height:1.5;margin-top:3px">${e[1]}</div>
    <div style="margin-top:8px"><span style="background:#F5F5F7;color:#6E6E7A;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600">${e[2]}</span> <span style="background:var(--rosa-nevoa);color:var(--rosa);padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700">3 × 30s</span></div></div>
  </div>`).join('')}
  </div>
  <button class="btn-primary" ${done?'disabled':''} onclick="completeWorkout(${dayTotal})">${done?svg('check',{s:17,w:2.4})+' Treino concluído':svg('check',{s:17,w:2.4})+' Marcar como Concluída'}</button>`;
}
function completeWorkout(d){
  if(S.done[d])return;
  S.done[d]=true; S.minutes+=15; save();
  const pct=progressPct();
  go('treinos');
  setTimeout(()=>alert(pct===100?'Parabéns! Você concluiu o programa de 21 dias! 🎉🌸':'Treino concluído! Cada dia é uma nova conquista. 🌸'),60);
}

function isToday(ts){const d=new Date(ts),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();}
function tempoRel(ts){const min=Math.floor((Date.now()-ts)/60000);
  if(min<1)return'agora';if(min<60)return`há ${min} min`;
  const h=Math.floor(min/60);if(isToday(ts))return`hoje ${new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  const dias=Math.floor(min/1440);return dias<=1?'ontem':`há ${dias} dias`;}

  S.chat.push({r:'me',t});

async function callAI(prompt){
  const r=await fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});

}

        <input id="authPass" type="password" autocomplete="${signup?'new-password':'current-password'}" placeholder="Mínimo 6 caracteres" onkeydown="if(event.key==='Enter')doAuth()" style="width:100%;border:1px solid #E3E3E8;background:#FAFAFB;border-radius:10px;height:48px;padding:0 14px;font-size:15px;outline:none"></div>
      ${AUTH.err?`<div style="background:#FDECEC;color:#C0392B;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600">${AUTH.err}</div>`:''}
      <button class="btn-primary" ${AUTH.busy?'disabled':''} onclick="doAuth()" style="margin-top:4px">${AUTH.busy?'Aguarde…':(signup?'Criar conta':'Entrar')}</button>
    </div>
    <div style="text-align:center;font-size:14px;color:var(--cinza)">
      ${signup?'Já tem conta?':'Ainda não tem conta?'}
      <span onclick="AUTH.mode='${signup?'login':'signup'}';AUTH.err='';renderAuth()" style="color:var(--rosa);font-weight:700;cursor:pointer">${signup?'Entrar':'Criar agora'}</span>
    </div>
  </div>`;
}
async function doAuth(){
  if(!sb){AUTH.err='Serviço indisponível. Recarregue a página.';renderAuth();return;}
  const email=(document.getElementById('authEmail').value||'').trim();
  const pass=(document.getElementById('authPass').value||'').trim();
  const nome=(document.getElementById('authName')?.value||'').trim();
  if(!email||!pass){AUTH.err='Preencha e-mail e senha.';renderAuth();return;}
  if(pass.length<6){AUTH.err='A senha precisa de ao menos 6 caracteres.';renderAuth();return;}
  AUTH.busy=true;AUTH.err='';renderAuth();
  try{
    if(AUTH.mode==='signup'){
      const {data,error}=await sb.auth.signUp({email,password:pass});
      if(error)throw error;
      if(nome){S.name=nome;AUTH.pendingName=nome;}
      if(!data.session){ // confirmação de e-mail ligada
        AUTH.busy=false;AUTH.err='Conta criada! Confirme pelo link enviado ao seu e-mail e depois faça login.';AUTH.mode='login';renderAuth();return;
      }
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error)throw error;
    }
    // onAuthStateChange cuida do resto
  }catch(e){
    AUTH.busy=false;
    AUTH.err=traduzErro(e.message||'Erro ao autenticar');
    renderAuth();
  }
}
function traduzErro(m){
  if(/Invalid login credentials/i.test(m))return'E-mail ou senha incorretos.';
  if(/already registered|already exists/i.test(m))return'Este e-mail já tem conta. Faça login.';
  if(/rate limit/i.test(m))return'Muitas tentativas. Aguarde um instante.';
  return m;
}
async function logout(){
  if(sb)await sb.auth.signOut();
  AUTH.user=null; S=structuredClone(DEFAULT);
  try{localStorage.removeItem('calistenia')}catch(e){}
  renderAuth();
}

/* ---- painel admin por CONTA (acesse em /#admin) ---- */
let ADMIN={data:null,busy:false,state:''}; // state: '' | 'no_session' | 'not_admin' | 'error'
function paintAdmin(){ document.getElementById('tabbar').style.display='none'; document.getElementById('view').innerHTML='<div class="fade">'+viewAdmin()+'</div>'; window.scrollTo(0,0); }
async function openAdmin(){ ADMIN={data:null,busy:true,state:''}; paintAdmin(); await adminLoad(); }
async function adminLoad(){
  ADMIN.busy=true; ADMIN.state=''; paintAdmin();
  try{
    if(!sb){ ADMIN.busy=false; ADMIN.state='error'; ADMIN.msg='Serviço indisponível.'; paintAdmin(); return; }
    const {data:{session}}=await sb.auth.getSession();
    if(!session){ ADMIN.busy=false; ADMIN.state='no_session'; paintAdmin(); return; }
    const r=await fetch('/.netlify/functions/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:'{}'});
    const j=await r.json();
    if(r.status===403){ ADMIN.busy=false; ADMIN.state='not_admin'; paintAdmin(); return; }
    if(r.status===401){ ADMIN.busy=false; ADMIN.state='no_session'; paintAdmin(); return; }
    if(!r.ok)throw new Error(j.error||'Erro ao carregar');
    ADMIN.data=j; ADMIN.busy=false; paintAdmin();
  }catch(e){ ADMIN.busy=false; ADMIN.state='error'; ADMIN.msg=e.message; paintAdmin(); }
}
function adminShell(inner){
  return `<div style="min-height:calc(100dvh - 40px);display:flex;flex-direction:column;justify-content:center;gap:18px;padding:8px 4px">
    <div style="text-align:center"><span style="display:inline-block;width:52px;height:52px;background:var(--rosa);-webkit-mask:url('conversacao.png') center/contain no-repeat;mask:url('conversacao.png') center/contain no-repeat"></span>
    <div style="font-weight:800;font-size:24px;color:var(--rosa);margin-top:8px">Painel Admin</div></div>
    ${inner}
    <div style="text-align:center"><span onclick="location.hash='';location.reload()" style="color:var(--cinza);font-weight:700;cursor:pointer;font-size:14px">← Voltar ao app</span></div>
  </div>`;
}
function viewAdmin(){
  if(ADMIN.busy) return adminShell(`<div style="text-align:center;color:var(--cinza)"><div style="width:34px;height:34px;margin:0 auto 12px;border:3px solid var(--rosa-nevoa);border-top-color:var(--rosa);border-radius:999px;animation:spin .8s linear infinite"></div>Carregando painel…</div>`);
  if(ADMIN.state==='no_session') return adminShell(`<div class="card" style="padding:22px;text-align:center;font-size:15px;color:var(--tinta-suave);line-height:1.6">Entre com sua <strong>conta de administrador</strong> para acessar o painel.<br><br><button class="btn-primary" onclick="location.hash='';location.reload()">Ir para o login</button></div>`);
  if(ADMIN.state==='not_admin') return adminShell(`<div class="card" style="padding:22px;text-align:center;font-size:15px;color:var(--tinta-suave);line-height:1.6">🔒 Sua conta não tem acesso de administrador.<br><span style="font-size:13px;color:var(--cinza)">Peça para um admin adicionar seu e-mail.</span></div>`);
  if(ADMIN.state==='error') return adminShell(`<div class="card" style="padding:22px;text-align:center;font-size:14px;color:#C0392B">${ADMIN.msg||'Erro ao carregar.'}<br><br><button class="btn-primary" onclick="adminLoad()">Tentar de novo</button></div>`);
  const d=ADMIN.data, fmt=ts=>ts?new Date(ts).toLocaleDateString('pt-BR'):'—';
  return `<div style="padding:4px 0 20px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div><div style="font-size:22px;font-weight:800">Painel Admin</div><div style="font-size:13px;color:var(--cinza)">Usuários e uso</div></div>
      <button class="btn-ghost" onclick="adminLoad()">Atualizar</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px">
      ${miniStat(d.totals.users,'Usuários')}${miniStat(d.totals.paid||0,'Pagantes')}${miniStat(d.totals.diets,'Dietas')}
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${d.users.map(u=>`<div class="card" style="padding:14px 16px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div style="min-width:0"><div style="font-size:16px;font-weight:800;color:var(--tinta-suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${(u.name||'—')}</div>
          <div style="font-size:13px;color:var(--cinza);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${(u.email||'—')}</div></div>
          <span style="background:${u.paid?'#E8F8F1':'#F5F5F7'};color:${u.paid?'#0E9F6E':'#8E8E99'};padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;flex-shrink:0">${u.paid?(u.plan==='assinatura'?'Assinante':'Pago'):'Grátis'}</span>
        </div>
        <div style="display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--cinza);font-weight:600;flex-wrap:wrap">
          <span style="display:flex;align-items:center;gap:4px">${svg('flame',{s:13})} ${u.workouts_done||0} treinos</span>
          <span style="display:flex;align-items:center;gap:4px">${svg('leaf',{s:13})} ${u.diets||0} dietas</span>
          <span style="display:flex;align-items:center;gap:4px">${svg('cal',{s:13})} ${fmt(u.created_at)}</span>
        </div>
      </div>`).join('')}
      ${d.users.length===0?'<div style="text-align:center;color:var(--cinza);padding:20px">Nenhum usuário ainda.</div>':''}
    </div>
    <div style="text-align:center;margin-top:18px"><span onclick="location.hash='';location.reload()" style="color:var(--cinza);font-weight:700;cursor:pointer;font-size:14px">← Voltar ao app</span></div>
  </div>`;
}
window.addEventListener('hashchange',()=>{ if(location.hash==='#admin') openAdmin(); });
async function adminCheck(){
  try{
    if(!sb)return; const {data:{session}}=await sb.auth.getSession(); if(!session)return;
    const r=await fetch('/.netlify/functions/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'check'})});
    const j=await r.json(); AUTH.isAdmin=!!j.admin;
    if(AUTH.isAdmin && route.tab==='perfil' && !route.sub) render();
  }catch(e){}
}

/* ---- boot ---- */
async function enterApp(user){
  AUTH.busy=false;
  await loadCloud(user);
  if(AUTH.pendingName){ S.name=AUTH.pendingName; AUTH.pendingName=null; }
  await adminCheck();                              // define AUTH.isAdmin
  const paid = AUTH.isAdmin || await checkEntitlement();
  if(!paid){ renderPaywall(); return; }            // paywall total: sem pagar, não entra
  document.getElementById('tabbar').style.display='flex';
  go('home'); cloudSave();
}
async function checkEntitlement(){
  try{
    const {data}=await sb.from('entitlements').select('active,plan,status,expires_at').limit(1);
    const e=(data&&data[0])||null;
    AUTH.plan=e?e.plan:null;
    let ok=!!(e&&e.active);
    if(ok&&e.expires_at&&new Date(e.expires_at)<new Date()) ok=false;
    AUTH.paid=ok; return ok;
  }catch(err){ AUTH.paid=false; return false; }
}
function renderPaywall(){
  document.getElementById('tabbar').style.display='none';
  document.getElementById('view').innerHTML='<div class="fade">'+viewPaywall()+'</div>';
  window.scrollTo(0,0);
}
function viewPaywall(){
  const feat=(t)=>`<div style="display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--tinta-suave)"><span style="color:var(--verde);flex-shrink:0;margin-top:2px">${svg('check',{s:16,c:'#10B981',w:3})}</span>${t}</div>`;
  return `<div style="display:flex;flex-direction:column;gap:18px;padding:8px 2px 24px">
    <div style="text-align:center;margin-top:8px">
      <span style="display:inline-block;width:52px;height:52px;background:var(--rosa);-webkit-mask:url('conversacao.png') center/contain no-repeat;mask:url('conversacao.png') center/contain no-repeat"></span>
      <div style="font-size:24px;font-weight:800;margin-top:8px">Desbloqueie o Calistenia</div>
      <div style="font-size:14px;color:var(--cinza);margin-top:4px">Programa de 21 dias, dieta e suporte com IA</div>
    </div>
    <div class="card" style="padding:20px;display:flex;flex-direction:column;gap:12px">
      ${feat('Programa completo de <strong>21 dias</strong> em vídeo')}
      ${feat('<strong>Dieta personalizada</strong> gerada por IA')}
      ${feat('<strong>Receitas</strong> saudáveis sob medida')}
      ${feat('<strong>Suporte 24h</strong> com a assistente Atlas')}
      ${feat('Acompanhamento de progresso e atividades extras')}
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <a href="${CAKTO_URL_ASSINATURA}" target="_blank" rel="noopener" style="text-decoration:none">
        <div class="btn-primary" style="height:56px;flex-direction:column;gap:2px;line-height:1.1">Assinar agora<span style="font-size:12px;font-weight:600;opacity:.9">acesso completo, renovação automática</span></div></a>
      <a href="${CAKTO_URL_UNICA}" target="_blank" rel="noopener" style="text-decoration:none">
        <div style="border:1.5px solid var(--rosa);color:var(--rosa);height:52px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:16px;line-height:1.1">Compra única<span style="font-size:12px;font-weight:600;opacity:.8">pague uma vez, acesso vitalício</span></div></a>
    </div>
    <div class="card" style="padding:16px;text-align:center;font-size:14px;color:var(--tinta-suave)">
      Já comprou? Use o <strong>mesmo e-mail</strong> da compra.<br>
      <span style="font-size:13px;color:var(--cinza)">Conta: ${AUTH.user?AUTH.user.email:''}</span>
      <button class="btn-primary" style="margin-top:12px;height:46px" onclick="refreshAccess(this)">Já comprei — liberar acesso</button>
    </div>
    <div style="text-align:center"><span onclick="logout()" style="color:var(--cinza);font-weight:700;cursor:pointer;font-size:14px">Sair / trocar de conta</span></div>
  </div>`;
}
async function refreshAccess(btn){
  if(btn){btn.disabled=true;btn.textContent='Verificando…';}
  const paid=AUTH.isAdmin||await checkEntitlement();
  if(paid){ document.getElementById('tabbar').style.display='flex'; go('home'); cloudSave(); }
  else{ if(btn){btn.disabled=false;btn.textContent='Já comprei — liberar acesso';} alert('Ainda não encontramos seu pagamento. 🌱\n\nSe você acabou de comprar, aguarde ~1 minuto e tente de novo. Confirme que usou o MESMO e-mail desta conta na compra.'); }
}
async function boot(){
  if(location.hash==='#admin'){ openAdmin(); return; } // painel admin
  if(!sb){ render(); return; } // sem Supabase: modo 100% local
  sb.auth.onAuthStateChange((evt,sess)=>{
    if(evt==='SIGNED_IN' && sess&&sess.user){ if(!AUTH.user) enterApp(sess.user); }
    else if(evt==='SIGNED_OUT'){ AUTH.user=null; renderAuth(); }
  });
  const {data:{session}}=await sb.auth.getSession();
  if(session&&session.user){ await enterApp(session.user); }
  else { renderAuth(); }
}
boot();
</script>
